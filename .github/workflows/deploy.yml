name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/sail-note-backend
            git pull origin main
            cat > .env << 'EOF'
            RAILS_MASTER_KEY=${{ secrets.RAILS_MASTER_KEY }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            EOF
            chmod 600 .env
            docker build -f Dockerfile.prod -t sailnote-backend .
            docker stop sailnote-backend || true
            docker rm sailnote-backend || true
            docker run -d --restart unless-stopped -p 8080:80 --env-file .env --name sailnote-backend sailnote-backend
