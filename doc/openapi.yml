components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 2
        username:
          type: string
          example: 田中
        email:
          type: string
          format: email
          example: example@sample.com
      required:
        - id
        - username
        - email
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          example: 田中
        email:
          type: string
          format: email
          example: example@sample.com
        password:
          type: string
          example: password1234
        boat_class:
          type: string
          example: snipe
      required:
        - username
        - email
        - password
        - boat_class
    PracticeRecord:
      type: object
      properties:
        id:
          type: integer
          example: 3
        user:
          $ref: "#/components/schemas/User"
        practice_date:
          type: string
          format: date
          description: 練習日
          example: "2026-03-01"
        wind_direction:
          type: string
          example: 北風
        wind_speed_min:
          type: integer
          example: 2
        wind_speed_max:
          type: integer
          example: 5
        tide:
          type: string
          example: 中潮
        mast_rake:
          type: integer
          example: 6550
        mast_bend:
          type: integer
          example: 30
        mast_spreader_angle:
          type: integer
          example: 720
        mast_spreader_length:
          type: integer
          example: 420
        mast_tension:
          type: integer
          example: 20
        content:
          type: string
          example: スタート練習
        reflection:
          type: string
          example: フルスピードでスタートできなかった
        weather_api:
          type: string
          example: 曇り
        temperature_api:
          type: number
          format: float
          example: 20.2
        image_url:
          type: string
          format: uri
          example: "https://example.com/images/practice1.jpg"
      required:
        - id
        - user
        - practice_date
    PracticeRecordCreateRequest:
      type: object
      properties:
        practice_date:
          type: string
          format: date
          description: 練習日
          example: "2026-03-01"
        wind_direction:
          type: string
          example: 北風
        wind_speed_min:
          type: integer
          example: 2
        wind_speed_max:
          type: integer
          example: 5
        tide:
          type: string
          example: 中潮
        mast_rake:
          type: integer
          example: 6550
        mast_bend:
          type: integer
          example: 30
        mast_spreader_angle:
          type: integer
          example: 720
        mast_spreader_length:
          type: integer
          example: 420
        mast_tension:
          type: integer
          example: 20
        content:
          type: string
          example: スタート練習
        reflection:
          type: string
          example: フルスピードでスタートできなかった
        weather_api:
          type: string
          example: 曇り
        temperature_api:
          type: number
          format: float
          example: 20.2
        image_url:
          type: string
          format: uri
          example: "https://example.com/images/practice1.jpg"
    Comment:
      type: object
      properties:
        id:
          type: integer
          example: 3
        user:
          $ref: "#/components/schemas/User"
        content:
          type: string
          example: コメントの内容
      required:
        - id
        - user
        - content
    CommentCreateRequest:
      type: object
      properties:
        content:
          type: string
          example: コメント
    Tournament:
      type: object
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: 全日本インカレ
        held_date:
          type: string
          format: date
          example: "2025-10-02"
        boats_count:
          type: integer
          example: 72
        race_count:
          type: integer
          example: 7
    TournamentCreateRequest:
      type: object
      properties:
        name:
          type: string
          example: 全日本インカレ
        held_date:
          type: string
          format: date
          example: "2025-10-02"
        boats_count:
          type: integer
          example: 72
        race_count:
          type: integer
          example: 7
    RaceResult:
      type: object
      properties:
        id:
          type: integer
          example: 3
    RaceResultCreateRequest:
      type: object
      properties:
        score:
          type: integer
          example: 3
    MonthlyGoal:
      type: object
      properties:
        id:
          type: integer
          example: 3
        user:
          $ref: "#/components/schemas/User"
        goal_date:
          type: string
          example: "2026-06-01"
        content:
          type: string
          example: 目標の内容
        achievement_rate:
          type: integer
          example: 90
      required:
        - goal_date
        - content
    MonthlyGoalCreateRequest:
      type: object
      properties:
        goal_date:
          type: string
          example: "2026-06-01"
        content:
          type: string
          example: 目標の内容
        achievement_rate:
          type: integer
          example: 90