openapi: 3.0.4
info:
  title: Sail note API
  version: 1.0.0
  description: セーリング練習記録アプリ
servers:
  # Added by API Auto Mocking Plugin
  - description: SwaggerHub API Auto Mocking
    url: https://virtserver.swaggerhub.com/nocompany-275/test/1.0.0
  - url: http://localhost:3000
    description: Local Development'
paths:
  /api/v1/auth/login:
    post:
      summary: ログイン
      description: メールアドレスとパスワードでログインしJWTを取得する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: sample@example.com
                password:
                  type: string
                  example: password123
              required:
                - email
                - password
      responses:
        "200":
          description: ログイン成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          description: 認証失敗
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
      operationId: ""
  /api/v1/auth/register:
    post:
      summary: 新規ユーザー登録
      description: 新規ユーザー登録しJWTを取得する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 登録成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
        "422":
          description: バリデーションエラー
  /api/v1/auth/me:
    get:
      summary: ユーザー情報取得
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
  "/api/v1/users/{id}":
    get:
      summary: ユーザー情報取得
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: ユーザーID
          required: true
          schema:
            type: integer
          example: 3
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
    patch:
      summary: ユーザー情報更新
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: ユーザーID
          required: true
          schema:
            type: integer
          example: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
                  format: email
                boat_class:
                  type: string
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
  /api/v1/practice_records:
    post:
      summary: 練習記録追加
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PracticeRecordCreateRequest"
      responses:
        "201":
          description: 練習記録作成成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  practice_record:
                    $ref: "#/components/schemas/PracticeRecord"
        "401":
          description: 認証エラー
        "404":
          description: 存在しません
    get:
      summary: 練習記録一覧取得
      security:
        - bearerAuth: []
      parameters:
        - name: wind_direction
          in: query
          description: 風向で絞り込み
          required: false
          schema:
            type: string
          example: 北風
        - name: wind_speed_min
          in: query
          description: 最低風速で絞り込み
          required: false
          schema:
            type: integer
          example: 2
        - name: wind_speed_max
          in: query
          description: 最高風速で絞り込み
          required: false
          schema:
            type: integer
          example: 5
        - name: practice_date
          in: query
          description: 練習日で絞り込み
          required: false
          schema:
            type: string
            format: date
          example: "2026-03-01"
        - name: user_id
          in: query
          description: ユーザーIDで絞り込み
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PracticeRecord"
  "/api/v1/practice_records/{id}":
    get:
      summary: 練習記録詳細取得
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: 練習記録ID
          required: true
          schema:
            type: integer
          example: 3
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  practice_record:
                    $ref: "#/components/schemas/PracticeRecord"
        "401":
          description: 認証エラー
        "404":
          description: 存在しない
    patch:
      summary: 練習記録更新
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: 練習記録ID
          required: true
          schema:
            type: integer
          example: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PracticeRecordCreateRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  practice_record:
                    $ref: "#/components/schemas/PracticeRecord"
        "401":
          description: 必須パラメータが不足しています
    delete:
      summary: 練習記録削除
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: 練習記録ID
          required: true
          schema:
            type: integer
          example: 3
      responses:
        "200":
          description: 削除成功
  "/api/v1/practice_records/{practice_record_id}/comments":
    post:
      summary: コメント追加
      security:
        - bearerAuth: []
      parameters:
        - name: practice_record_id
