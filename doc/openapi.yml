        "404":
          description: 存在しません
    get:
      summary: コメント一覧取得
      security:
        - bearerAuth: []
      parameters:
        - name: practice_record_id
          in: path
          description: 練習記録ID
          required: true
          schema:
            type: integer
          example: 3
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
  "/api/v1/comments/{id}":
    delete:
      summary: コメント削除
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: コメントID
          required: true
          schema:
            type: integer
          example: 3
      responses:
        "200":
          description: 削除成功

